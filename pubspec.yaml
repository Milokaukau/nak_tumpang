name: nak_tumpang
description: "An app that allows you to request for tumpang / fetch others."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^14.0.3
  provider: ^6.1.2
  http: ^1.2.0
  archive: ^4.2.0
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.2
  sqflite: ^2.4.4
  path: ^1.9.1
  image_picker: ^1.1.2
  csv: ^6.0.0
  uuid: ^4.5.1
  flutter_stripe: ^14.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  sensors_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launch_app_logo.png"
  adaptive_icon_background: "#F5B301"
  adaptive_icon_foreground: "assets/launch_app_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash_app_logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/splash_app_logo.png"

flutter:

  uses-material-design: true
  assets:
    - .env
    - assets/
